name: Christina Lab CI

on:
  push:
    branches:
      - main
      - backend/**
      - feature/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: christina_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d christina_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/christina_lab_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile backend entrypoints
        run: python -m py_compile backend/app/main.py backend/app/creator_agent.py backend/app/ai_provider.py

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Set up Node for JavaScript syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript syntax
        run: |
          node --check app.js
          node --check agent.js
