name: Backup Christina Lab workflow

on:
  push:
    branches:
      - ops/backup-workflow-20260921

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current workflow JSON
        run: |
          python - <<'PY'
          import json, urllib.request
          url="https://christina-lab.onrender.com/api/workflow"
          with urllib.request.urlopen(url, timeout=60) as r:
              payload=json.loads(r.read().decode("utf-8"))
          print("WORKFLOW_BACKUP_START")
          print(json.dumps(payload, ensure_ascii=False))
          print("WORKFLOW_BACKUP_END")
          PY
